  <meta name="description" content="Arribos en tiempo real de trenes, subte y colectivos del AMBA (Buenos Aires). Sin instalar nada." />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="iconbtn hidden" aria-label="Volver">‹</button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Andén</span>
        <span class="brand-tag">web</span>
      </div>
      <span class="topbar-spacer"></span>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button class="tab" data-view="cerca">
        <span class="tab-ico" data-ico="near"></span><span>Cerca</span>
      </button>
      <button class="tab" data-view="favoritos">
        <span class="tab-ico" data-ico="star"></span><span>Favoritos</span>
      </button>
      <button class="tab" data-view="mapa">
        <span class="tab-ico" data-ico="map"></span><span>Mapa</span>
      </button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>

</html>
