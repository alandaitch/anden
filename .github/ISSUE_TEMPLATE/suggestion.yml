name: Proponer una mejora
description: Describí una necesidad concreta de los usuarios.
title: "[Mejora]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Necesidad
      description: Explicá el problema antes de proponer una solución.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Funcionamiento actual
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Contexto público
      placeholder: Línea D, estación Congreso de Tucumán
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que eliminé datos personales y credenciales.
          required: true
