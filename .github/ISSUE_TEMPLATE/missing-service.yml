name: Reportar transporte faltante
description: Informá una línea, ramal, estación o servicio ausente.
title: "[Faltante]: "
labels:
  - data
body:
  - type: markdown
    attributes:
      value: |
        Usá referencias públicas. No publiques tu ubicación exacta.
  - type: dropdown
    id: transport_type
    attributes:
      label: Tipo de transporte
      options:
        - Colectivo
        - Tren
        - Subte
        - EcoBici
        - Otro
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Línea, ramal o servicio
      placeholder: Línea 60, ramal F
    validations:
      required: true
  - type: input
    id: public_area
    attributes:
      label: Zona pública aproximada
      description: Indicá una estación, parada, cruce o barrio.
      placeholder: Estación Núñez
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué debería aparecer
      description: Explicá brevemente la cobertura esperada.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Fuente oficial
      description: Agregá un enlace público cuando exista.
      placeholder: https://sitio-oficial.example/
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que eliminé datos personales y credenciales.
          required: true
