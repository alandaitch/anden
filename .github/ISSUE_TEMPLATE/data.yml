name: Reportar un problema de datos
description: Informá horarios, recorridos, nombres o posiciones incorrectas.
title: "[Datos]: "
labels:
  - bug
  - data
body:
  - type: markdown
    attributes:
      value: |
        Usá referencias públicas. No publiques tu ubicación exacta.
  - type: input
    id: transport
    attributes:
      label: Transporte relacionado
      placeholder: Colectivo 60, ramal F
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Dato observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Dato esperado
    validations:
      required: true
  - type: input
    id: checked_at
    attributes:
      label: Momento aproximado
      placeholder: 25 de agosto, 18:30
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Fuente oficial
      placeholder: https://sitio-oficial.example/
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que eliminé datos personales y credenciales.
          required: true
